name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }}, ${{ matrix.threads }} thread(s), ${{ matrix.os }}${{ matrix.downgrade && ', oldest dependencies' || '' }}
    runs-on: ${{ matrix.os }}
    # a failure on a prerelease of Julia does not fail the run
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version: ['lts', '1']
        threads: [1]
        os: [ubuntu-latest]
        include:
          # evaluate_batch and the device emitters use threads
          - version: '1'
            threads: 4
            os: ubuntu-latest
          - version: '1'
            threads: 1
            os: macos-latest
          # JET is pinned to minor versions of Julia and breaks on new releases, which
          # should not block the other jobs: test/test_quality.jl runs it only when
          # QD_JET is "1", set here for this one job
          - version: '1'
            threads: 1
            os: ubuntu-latest
            jet: '1'
          # the oldest version of every dependency that [compat] allows, on the oldest
          # minor version of Julia that it allows, so that the lower bounds are tested;
          # the latest patch release, since Julia 1.10.0 does not start on current
          # Linux runners (its libopenlibm requests an executable stack)
          - version: '1.10'
            threads: 1
            os: ubuntu-latest
            downgrade: true
          # the next Julia: the latest alpha, beta or release candidate
          - version: 'pre'
            threads: 1
            os: ubuntu-latest
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      QD_JET: ${{ matrix.jet }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # resolves the package and test/ together, weak dependencies included, and writes
      # the manifests that the tests then use unchanged
      - uses: julia-actions/julia-downgrade-compat@v2
        if: matrix.downgrade
        with:
          projects: '.,test'
          julia_version: 'min'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          allow_reresolve: ${{ !matrix.downgrade }}
      # coverage from the Linux jobs only; Codecov takes an upload to a public repository
      # only with the CODECOV_TOKEN secret, except from a pull request from a fork
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
